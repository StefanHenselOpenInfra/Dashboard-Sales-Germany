<html lang="de">
<head>
<meta charset="utf-8">
<title>Open Infra – Projektkarte Deutschland</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, Arial, sans-serif; }
#map { height: 100vh; width: 100vw; }

#panel {
  position: fixed; top: 12px; left: 12px; z-index: 1000;
  background: rgba(255,255,255,0.97);
  border-radius: 14px; padding: 14px 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
  min-width: 210px; max-width: 240px;
}
#panel h2 { font-size: 14px; font-weight: 900; color: #C86750; margin-bottom: 12px; letter-spacing: 0.04em; }
.fg { margin-bottom: 10px; }
.fl { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
.bg { display: flex; flex-wrap: wrap; gap: 4px; }
.btn {
  padding: 3px 9px; border: 2px solid #e2e8f0; border-radius: 20px;
  font-size: 11px; font-weight: 700; cursor: pointer; background: white; color: #475569;
  transition: all 0.15s;
}
.btn:hover { border-color: #cbd5e1; }
.btn.on { color: white !important; border-color: transparent !important; }
.btn-all.on  { background: #334155; }
.btn-bb.on   { background: #1d4ed8; }
.btn-by.on   { background: #15803d; }
.btn-ni.on   { background: #9333ea; }
.btn-run.on  { background: #1d4ed8; }
.btn-fun.on  { background: #ea580c; }
.btn-cem.on  { background: #6b7280; }

.divider { border-top: 1px solid #e2e8f0; margin: 10px 0; }
.leg { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; font-size: 11px; font-weight: 600; color: #334155; }
.dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(0,0,0,0.15); }

#stats {
  position: fixed; bottom: 12px; left: 12px; z-index: 1000;
  background: rgba(255,255,255,0.97); border-radius: 12px; padding: 10px 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15); display: flex; gap: 14px;
}
.st { text-align: center; }
.st-n { font-size: 18px; font-weight: 900; color: #252121; line-height: 1; }
.st-l { font-size: 10px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 2px; }

/* Popup */
.pop-title { font-weight: 900; font-size: 14px; color: #252121; margin-bottom: 8px; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; }
.pop-row { padding: 3px 0; font-size: 12px; display: flex; align-items: baseline; gap: 5px; }
.pop-row:not(:last-child) { border-bottom: 1px solid #f8fafc; }
.bx { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; white-space: nowrap; }
.bx-run { background: #dbeafe; color: #1e40af; }
.bx-fun { background: #fed7aa; color: #c2410c; }
.bx-cem { background: #e5e7eb; color: #4b5563; }
.bx-hp0 { background: #fef9c3; color: #92400e; }
.bx-mev { background: #ede9fe; color: #5b21b6; }
.pop-hp { font-size: 11px; color: #64748b; }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h2>🏗 Open Infra Projekte</h2>
  <div class="fg">
    <div class="fl">Region</div>
    <div class="bg">
      <button class="btn btn-all on"  onclick="setR('all',this)">Alle</button>
      <button class="btn btn-bb"      onclick="setR('BB',this)">Brandenburg</button>
      <button class="btn btn-by"      onclick="setR('BY',this)">Bayern</button>
      <button class="btn btn-ni"      onclick="setR('NI',this)">Niedersachsen</button>
    </div>
  </div>
  <div class="fg">
    <div class="fl">Status</div>
    <div class="bg">
      <button class="btn btn-all on" onclick="setS('all',this)">Alle</button>
      <button class="btn btn-run"    onclick="setS('active',this)">Aktiv</button>
      <button class="btn btn-fun"    onclick="setS('funnel',this)">Funnel</button>
      <button class="btn btn-cem"    onclick="setS('cemetery',this)">Abgeschl.</button>
    </div>
  </div>
  <div class="divider"></div>
  <div class="leg"><div class="dot" style="background:#1d4ed8"></div>Aktive Projekte</div>
  <div class="leg"><div class="dot" style="background:#ea580c"></div>Funnel / Pipeline</div>
  <div class="leg"><div class="dot" style="background:#6b7280"></div>Abgeschlossen</div>
  <div class="leg"><div class="dot" style="background:#f59e0b;border-color:#d97706"></div>HP0 Projekte</div>
  <div class="leg"><div class="dot" style="background:#a855f7"></div>MEV Projekte</div>
  <div class="leg"><div class="dot" style="background:#252121;border-radius:2px;"></div>Mehrere Status</div>
  <div class="divider"></div>
  <div style="font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;">BOB Lieferstatus</div>
  <div class="leg"><div class="dot" style="background:#16a34a"></div>Fertig gebaut</div>
  <div class="leg"><div class="dot" style="background:#0891b2"></div>In Betrieb (Driftsättning)</div>
  <div class="leg"><div class="dot" style="background:#d97706"></div>Im Bau (Grävning)</div>
</div>

<div id="stats">
  <div class="st"><div class="st-n" id="sn-run">–</div><div class="st-l">🔵 Aktiv</div></div>
  <div class="st"><div class="st-n" id="sn-fun">–</div><div class="st-l">🟠 Funnel</div></div>
  <div class="st"><div class="st-n" id="sn-cem">–</div><div class="st-l">⚫ Abgesch.</div></div>
  <div class="st"><div class="st-n" id="sn-tot">–</div><div class="st-l">Standorte</div></div>
</div>

// ============================================================
// MAP INIT
// ============================================================
const map = L.map('map', {
  center: [52.2, 12.8],
  zoom: 7,
  zoomControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

// ============================================================
// FILTER STATE
// ============================================================
let fRegion = 'all';
let fStatus = 'all';
let markers = [];
let clusters = null;

function domStatus(s) {
  if(s==='active') return 'Aktiv';
  if(s==='funnel') return 'Funnel';
  if(s==='cemetery') return 'Abgeschlossen';
  return s;
}

function getColor(loc) {
  const statuses = [...new Set(loc.p.map(p=>p.s))];
  const isMEV = loc.p.some(p=>p.t==='MEV');
  const isHP0 = loc.p.every(p=>p.t==='HP0' || p.hp===0);
  if(isMEV) return '#a855f7';
  // If only BOB delivery data (no real sales projects), color by delivery
  if(loc.p.length===1 && loc.p[0].t==='Build' && loc.d) return loc.d.color;
  if(statuses.includes('active')) return '#1d4ed8';
  if(statuses.includes('funnel')) {
    if(isHP0 && loc.p.some(p=>p.t==='HP0')) return '#f59e0b';
    return '#ea580c';
  }
  return '#6b7280';
}

function getRadius(loc) {
  const totalHP = loc.p.reduce((s,p)=>s+(p.hp||0),0);
  if(totalHP===0) return 7;
  return Math.min(26, Math.max(7, Math.sqrt(totalHP/20)));
}

function makePopup(loc) {
  const totalHP = loc.p.reduce((s,p)=>s+(p.hp||0),0);
  const totalHC = loc.p.reduce((s,p)=>s+(p.hc||0),0);
  const pct = totalHP>0?((totalHC/totalHP)*100).toFixed(0)+'%':'—';

  let html = `<div class="pop-title">📍 ${loc.n}</div>`;

  // Group by status
  const groups = {active:[], funnel:[], cemetery:[]};
  loc.p.forEach(p => { if(groups[p.s]) groups[p.s].push(p); });

  const renderGroup = (label, cls, items) => {
    if(!items.length) return '';
    let h = '';
    items.forEach(p => {
      const isMEV = p.t==='MEV';
      const isHP0 = p.t==='HP0';
      const typeBadge = isMEV ? `<span class="bx bx-mev">MEV</span>` :
                        isHP0 ? `<span class="bx bx-hp0">HP0</span>` : '';
      const hpInfo = p.hp>0 ? `<span class="pop-hp">${p.hp.toLocaleString('de-DE')} HP` + (p.hc>0?` · ${p.hc} HC`:'') + '</span>' : '';
      const agencyInfo = p.a ? `<span class="pop-hp">· ${p.a}</span>` : '';
      h += `<div class="pop-row"><span class="bx ${cls}">${label}</span>${typeBadge}<b>${p.n}</b>${hpInfo}${agencyInfo}</div>`;
    });
    return h;
  };

  html += renderGroup('Aktiv','bx-run', groups.active);
  html += renderGroup('Funnel','bx-fun', groups.funnel);
  html += renderGroup('Abgeschl.','bx-cem', groups.cemetery);

  if(totalHP>0) {
    html += `<div style="margin-top:6px;padding-top:6px;border-top:1px solid #e2e8f0;font-size:11px;color:#475569;">
      <b>Gesamt:</b> ${totalHP.toLocaleString('de-DE')} Adressen · ${totalHC} Signings · ${pct} Uptake
    </div>`;
  }


  // BOB Delivery info
  if(loc.d && loc.d.addr > 0) {
    const statStr = Object.entries(loc.d.statuses||{}).map(([s,n])=>`${s}: ${n}`).join(' · ');
    html += `<div style="margin-top:6px;padding:5px 7px;background:#f0fdf4;border-radius:6px;border-left:3px solid ${loc.d.color};">
      <div style="font-size:10px;font-weight:800;color:#166534;text-transform:uppercase;letter-spacing:0.08em;">🏗 BOB Lieferstatus</div>
      <div style="font-size:11px;color:#15803d;margin-top:2px;"><b>${loc.d.primary}</b> · ${loc.d.addr.toLocaleString('de-DE')} Adressen · ${loc.d.hc} HC</div>
      <div style="font-size:10px;color:#6b7280;margin-top:2px;">${statStr}</div>
    </div>`;
  }
  return html;
}

function isVisible(loc) {
  if(fRegion !== 'all' && loc.r !== fRegion) return false;
  if(fStatus !== 'all') {
    const hasStatus = loc.p.some(p=>p.s===fStatus);
    if(!hasStatus) return false;
  }
  return true;
}

function redraw() {
  if(clusters) map.removeLayer(clusters);
  clusters = L.markerClusterGroup({
    maxClusterRadius: 40,
    iconCreateFunction: function(cluster) {
      const count = cluster.getChildCount();
      return L.divIcon({
        html: `<div style="background:#334155;color:white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);">${count}</div>`,
        className: '',
        iconSize: L.point(32, 32)
      });
    }
  });

  let cActive=0, cFunnel=0, cCem=0, cTot=0;

  D.forEach(loc => {
    if(!isVisible(loc)) return;
    cTot++;
    const hasStat = s => loc.p.some(p=>p.s===s);
    if(hasStat('active')) cActive++;
    if(hasStat('funnel')) cFunnel++;
    if(hasStat('cemetery')) cCem++;

    const color = getColor(loc);
    const r = getRadius(loc);
    const statuses = [...new Set(loc.p.map(p=>p.s))];
    const hasMulti = statuses.length > 1;

    const marker = L.circleMarker([loc.lat, loc.lng], {
      radius: r,
      fillColor: color,
      color: hasMulti ? '#252121' : color,
      weight: hasMulti ? 2.5 : 1.5,
      opacity: 1,
      fillOpacity: 0.82
    }).bindPopup(makePopup(loc), {maxWidth: 380, minWidth: 260});

    clusters.addLayer(marker);
  });

  map.addLayer(clusters);

  document.getElementById('sn-run').textContent = cActive;
  document.getElementById('sn-fun').textContent = cFunnel;
  document.getElementById('sn-cem').textContent = cCem;
  document.getElementById('sn-tot').textContent = cTot;
}

function setR(val, btn) {
  fRegion = val;
  document.querySelectorAll('.btn-all, .btn-bb, .btn-by, .btn-ni').forEach(b => {
    if(b.classList.contains('btn-run') || b.classList.contains('btn-fun') || b.classList.contains('btn-cem')) return;
    b.classList.remove('on');
  });
  btn.classList.add('on');
  redraw();
}

function setS(val, btn) {
  fStatus = val;
  document.querySelectorAll('.btn-run, .btn-fun, .btn-cem').forEach(b => b.classList.remove('on'));
  // also handle the "all" button in status group
  document.querySelectorAll('#panel .bg').forEach(bg => {
    const btns = bg.querySelectorAll('.btn');
    const hasRunFunCem = [...btns].some(b=>b.classList.contains('btn-run'));
    if(hasRunFunCem) btns.forEach(b=>b.classList.remove('on'));
  });
  btn.classList.add('on');
  redraw();
}

redraw();

// Add scale
L.control.scale({imperial: false}).addTo(map);
</script>
